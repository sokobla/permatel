# ═════════════════════════════════════════════════════════════════════════════
# PERMATEL — Stack de déploiement (production)
#
# Sécurité / robustesse :
#   - secrets obligatoires (échec au démarrage si absents),
#   - DB/Redis/backend NON exposés sur l'hôte (réseau interne) ; seul le
#     frontend proxifie /api et /uploads vers le backend,
#   - utilisateurs non-root, no-new-privileges, limites mémoire/CPU/PIDs,
#     rotation des logs, healthchecks et redémarrage automatique.
#
# TLS / reverse-proxy : géré par un Traefik PARTAGÉ, externe à ce fichier (voir
# ../traefik/README.md) — mutualisé avec les autres applications du même
# serveur. Ce compose ne démarre plus son propre Traefik ; le frontend
# rejoint simplement le réseau externe `traefik_public` et porte ses labels.
#
# Pré-requis :
#   1. Le stack Traefik partagé est démarré (../traefik/).
#   2. Un fichier .env à la racine de CE projet (voir .env.example).
#   docker compose up -d --build
# ═════════════════════════════════════════════════════════════════════════════

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  # ── PostgreSQL (interne, non exposé) ────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: permatel_db
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:?POSTGRES_DB requis dans .env}
      POSTGRES_USER:     ${POSTGRES_USER:?POSTGRES_USER requis dans .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis dans .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - permatel_internal
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 200
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (interne, non exposé) — compteur anti-brute-force partagé ────────
  redis:
    image: redis:7-alpine
    container_name: permatel_redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - permatel_internal
    restart: unless-stopped
    stop_grace_period: 10s
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 50
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend Flask / Gunicorn (interne) ──────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: permatel_backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET_KEY:          ${JWT_SECRET_KEY:?JWT_SECRET_KEY requis dans .env}
      SETTINGS_ENCRYPTION_KEY: ${SETTINGS_ENCRYPTION_KEY:?SETTINGS_ENCRYPTION_KEY requis dans .env}
      FLASK_ENV:   production
      AUTO_MIGRATE: "false"            # migrations jouées par l'entrypoint
      APP_NAME:    ${APP_NAME:-PERMATEL API}
      APP_VERSION: ${APP_VERSION:-1.4.0}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost}
      JWT_ACCESS_TOKEN_EXPIRES_MINUTES:   ${JWT_ACCESS_TOKEN_EXPIRES_MINUTES:-15}
      JWT_REFRESH_TOKEN_EXPIRES_DAYS:     ${JWT_REFRESH_TOKEN_EXPIRES_DAYS:-1}
      SESSION_INACTIVITY_TIMEOUT_MINUTES: ${SESSION_INACTIVITY_TIMEOUT_MINUTES:-30}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
      GUNICORN_WORKER_CLASS: ${GUNICORN_WORKER_CLASS:-eventlet}
      SOCKETIO_ASYNC_MODE: ${SOCKETIO_ASYNC_MODE:-eventlet}
      # Géolocalisation IP (drapeau pays, Rapports > Sessions, 14/08) — base
      # MaxMind GeoLite2-Country locale, montée en lecture seule ci-dessous
      # depuis ./backend/geoip/ (fichier .mmdb non versionné, licence MaxMind
      # — cf. README pour l'obtenir). Optionnel : absente, le lookup
      # dégrade proprement (aucun drapeau affiché).
      GEOIP_DB_PATH: ${GEOIP_DB_PATH:-/app/geoip/GeoLite2-Country.mmdb}
    volumes:
      - backend_uploads:/app/app/uploads
      - ./backend/geoip:/app/geoip:ro
    networks:
      - permatel_internal
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    mem_limit: 1g
    cpus: 1.5
    pids_limit: 400
    logging: *default-logging

  # ── Core Connector Téléphonie (Phase 12, opt-in) ────────────────────────────
  # Process UNIQUE orchestrant tous les PBXAdapter (ESL/AMI/TSAPI) configurés
  # via /pbx-connectors (UI admin globale). Inactif par défaut : n'a d'intérêt
  # que si au moins un connecteur PBX est configuré. Démarrer avec :
  #   docker compose --profile telephony up -d
  telephony-connector:
    build:
      context: ./connector
      dockerfile: Dockerfile
    container_name: permatel_telephony_connector
    profiles:
      - telephony
    environment:
      PERMATEL_API_URL: "http://backend:5000/api"
      TELEPHONY_CONNECTOR_TOKEN: ${TELEPHONY_CONNECTOR_TOKEN:?TELEPHONY_CONNECTOR_TOKEN requis dans .env pour le profil telephony}
      CONFIG_REFRESH_SECONDS: ${TELEPHONY_CONFIG_REFRESH_SECONDS:-60}
      # Signal "Sync" quasi temps réel (bouton Paramètres > Téléphonie) —
      # optionnel : sans Redis joignable, le connecteur applique quand même
      # sync_requested_at au prochain sondage périodique (filet de secours).
      REDIS_URL: redis://redis:6379/0
    networks:
      - permatel_internal
    depends_on:
      backend:
        condition: service_started
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 15s
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 100
    logging: *default-logging

  # ── Frontend Nginx (exposé via le Traefik partagé du serveur) ───────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_APP_NAME:    ${VITE_APP_NAME:-PERMATEL}
        VITE_APP_VERSION: ${APP_VERSION:-1.4.0}
        # Dérivé de la MÊME variable que le backend (SESSION_INACTIVITY_TIMEOUT_MINUTES,
        # cf. service backend ci-dessus) — jamais une variable VITE_ séparée, pour
        # qu'un déploiement ne puisse plus les faire diverger : sans ce build arg, le
        # frontend se rabattait toujours sur son défaut JS (30 min), déconnectant
        # l'agent côté UI même quand la session serveur restait valide plus longtemps.
        VITE_INACTIVITY_TIMEOUT_MINUTES: ${SESSION_INACTIVITY_TIMEOUT_MINUTES:-30}
    container_name: permatel_frontend
    # Port publié UNIQUEMENT pour le mode SANS Traefik partagé (TLS géré
    # autrement, ex. LB externe). Par défaut bind sur 127.0.0.1 (non exposé
    # sur Internet) ; si vous utilisez le Traefik partagé (../traefik/, cas
    # normal), ce port n'a pas besoin d'être ouvert sur l'extérieur — seul le
    # réseau `traefik_public` ci-dessous fait transiter le trafic.
    ports:
      - "${FRONTEND_BIND:-127.0.0.1}:${FRONTEND_PORT:-8080}:8080"
    networks:
      - permatel_internal
      - traefik_public
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 100
    logging: *default-logging
    labels:
      - "traefik.enable=true"
      # ── Routeur principal (HTTPS) ─────────────────────────────────────────
      - "traefik.http.routers.permatel.rule=Host(`${DOMAIN:-localhost}`)"
      - "traefik.http.routers.permatel.entrypoints=websecure"
      - "traefik.http.routers.permatel.tls=true"
      - "traefik.http.routers.permatel.tls.certresolver=le"
      - "traefik.http.routers.permatel.middlewares=permatel-sec@docker,permatel-ratelimit@docker,permatel-inflight@docker,permatel-buffer@docker"
      - "traefik.http.services.permatel.loadbalancer.server.port=8080"
      # ── Routeur dédié au login : limite stricte anti-brute-force (edge) ────
      - "traefik.http.routers.permatel-auth.rule=Host(`${DOMAIN:-localhost}`) && PathPrefix(`/api/auth/login`)"
      - "traefik.http.routers.permatel-auth.entrypoints=websecure"
      - "traefik.http.routers.permatel-auth.tls=true"
      - "traefik.http.routers.permatel-auth.tls.certresolver=le"
      - "traefik.http.routers.permatel-auth.middlewares=permatel-sec@docker,permatel-authlimit@docker"
      # ── Middleware : en-têtes de sécurité (HSTS, anti-clickjacking…) ───────
      - "traefik.http.middlewares.permatel-sec.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.permatel-sec.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.permatel-sec.headers.stsPreload=true"
      - "traefik.http.middlewares.permatel-sec.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.permatel-sec.headers.frameDeny=true"
      - "traefik.http.middlewares.permatel-sec.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.permatel-sec.headers.browserXssFilter=true"
      - "traefik.http.middlewares.permatel-sec.headers.referrerPolicy=strict-origin-when-cross-origin"
      - "traefik.http.middlewares.permatel-sec.headers.permissionsPolicy=geolocation=(), microphone=(), camera=()"
      # Content-Security-Policy : filet de sécurité navigateur derrière la
      # sanitisation DOMPurify déjà en place sur les 3 `v-html` de l'app — une
      # régression future (DOMPurify retiré/contourné, dépendance compromise)
      # est bloquée par le navigateur plutôt qu'exécutée. 'unsafe-inline' sur
      # style-src reste nécessaire pour les styles dynamiques de Vuetify ;
      # fonts.googleapis.com/gstatic.com pour le chargement Google Fonts (Roboto).
      - "traefik.http.middlewares.permatel-sec.headers.contentSecurityPolicy=default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
      # Masque les en-têtes révélateurs (anti-fuite d'info)
      - "traefik.http.middlewares.permatel-sec.headers.customResponseHeaders.Server="
      - "traefik.http.middlewares.permatel-sec.headers.customResponseHeaders.X-Powered-By="
      # ── Middleware : limite de débit globale (anti-DoS) ───────────────────
      - "traefik.http.middlewares.permatel-ratelimit.ratelimit.average=100"
      - "traefik.http.middlewares.permatel-ratelimit.ratelimit.burst=50"
      - "traefik.http.middlewares.permatel-ratelimit.ratelimit.period=1s"
      # ── Middleware : requêtes concurrentes max (anti-DoS) ─────────────────
      - "traefik.http.middlewares.permatel-inflight.inflightreq.amount=100"
      # ── Middleware : taille max du corps (anti-abus / slow body) ──────────
      - "traefik.http.middlewares.permatel-buffer.buffering.maxRequestBodyBytes=20971520"
      - "traefik.http.middlewares.permatel-buffer.buffering.memRequestBodyBytes=2097152"
      # ── Middleware : limite stricte sur le login (5/min) ──────────────────
      - "traefik.http.middlewares.permatel-authlimit.ratelimit.average=5"
      - "traefik.http.middlewares.permatel-authlimit.ratelimit.burst=10"
      - "traefik.http.middlewares.permatel-authlimit.ratelimit.period=1m"

volumes:
  postgres_data:
  backend_uploads:

networks:
  permatel_internal:
    name: permatel_internal      # nom fixe (évite le préfixe projet → labels Traefik OK)
    driver: bridge
  # Réseau du Traefik PARTAGÉ du serveur (../traefik/) — créé/possédé par ce
  # stack-là, jamais par PERMATEL. `external: true` : docker compose échoue
  # au démarrage si `docker network create traefik_public` (ou le stack
  # traefik/) n'a pas encore été lancé — c'est voulu (fail-fast).
  traefik_public:
    external: true
