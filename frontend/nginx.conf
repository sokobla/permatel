# ─────────────────────────────────────────────────────────────────────────────
# PERMATEL — Nginx (frontend statique + proxy API)
# Sert le SPA, proxifie /api et /uploads vers le backend (same-origin),
# applique des en-têtes de sécurité et la compression.
# ─────────────────────────────────────────────────────────────────────────────

# Connection: upgrade uniquement pour les requêtes qui la demandent
# réellement (handshake WebSocket Socket.IO) — sur une requête HTTP
# classique $http_upgrade est vide, la location /api/ (mixte REST +
# /api/socket.io) ne doit donc pas forcer "upgrade" pour tout le monde.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Taille max des uploads (pièces jointes / avatars)
    client_max_body_size 16m;

    # ── Sécurité ──────────────────────────────────────────────────────────────
    # Les en-têtes de sécurité (HSTS, X-Frame-Options, nosniff, Referrer/Permissions
    # -Policy) sont appliqués par Traefik (edge) pour éviter les doublons.
    # Nginx étant interne, on se limite ici à masquer sa version.
    server_tokens off;

    # ── Compression ───────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ── Healthcheck léger ─────────────────────────────────────────────────────
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # ── Proxy API → backend ───────────────────────────────────────────────────
    # En-têtes Upgrade/Connection : requis pour le namespace Socket.IO
    # (/api/socket.io, module Téléphonie) qui bascule en WebSocket sur cette
    # même location — sans eux, nginx ne propage jamais le handshake
    # d'upgrade et le client reste bloqué en "Déconnecté" indéfiniment.
    # Sans effet sur les requêtes HTTP classiques (elles ne portent pas
    # d'en-tête Upgrade, donc $http_upgrade est vide).
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 60s;
    }

    # Fichiers servis par le backend (avatars, etc.)
    location /uploads/ {
        proxy_pass http://backend:5000;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Assets statiques (cache long, hashés par Vite) ────────────────────────
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── SPA fallback ──────────────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }
}
